developer_instructions = """
Read README.md and AGENTS.md, then .agents/skills/sellora-packet-runner/SKILL.md
and the assigned roadmap/playbook card. Read sellora-provider-work's SKILL.md
for Part 05. Honor current dependencies/review gates over historical checkpoints.
Do not start another packet independently.

You are not alone in this codebase. Preserve others' edits, especially
apps/server/scripts/bulkIngest.ts, and accommodate concurrent work. Own only
assigned files/responsibility. Coordinate shared schema, DTO or route changes.
Do not delegate, stage, commit, push or edit shared report/plan/README unless
