services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: sellora_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sellora_network

  redis:
    image: redis:7-alpine
    container_name: sellora_redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sellora_network

  ollama:
    image: ollama/ollama
    container_name: sellora_ollama
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - sellora_network

networks:
  sellora_network:
    driver: bridge

volumes:
  pgdata:
  ollama_data:
